name: ci

on:
  push:
  pull_request:

jobs:

  test-release-build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - toolchain: "nightly"

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v2


      - name: Setup | Toolchain
        uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: "${{ matrix.toolchain }}"


      - name: Build | Release Mode
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release


  unittest:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Golden tests run only on macOS; other OSes ignore them.
        os: [ubuntu-latest, macos-latest]
        include:
          - toolchain: "nightly"
            features: ""

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v2


      - name: Setup | Toolchain
        uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: "${{ matrix.toolchain }}"


      - uses: mfinelli/setup-imagemagick@v8
      - run: magick drdrxp.jpg -resize 100x100 output.jpg

      - name: Test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --features "${{ matrix.features }}" --  --show-output
        env:
          # The CI may not have enough resource to run all tests in parallel.
          RUST_TEST_THREADS: 1
          RUST_LOG: debug
          RUST_BACKTRACE: full

      - name: Upload debug images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-images-${{ matrix.os }}
          path: tests/debug/
          retention-days: 7


  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: nightly
          components: rustfmt, clippy


      - name: Format
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check


      - name: clippy
        shell: bash
        run: |
          cargo clippy --no-deps --workspace --all-targets                -- -D warnings


      - name: Build-doc
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --all --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

